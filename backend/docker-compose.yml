version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: connectx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-connectx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-connectx_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-connectx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - connectx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-connectx} -d ${POSTGRES_DB:-connectx}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: connectx_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - connectx_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: connectx_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - connectx_minio_data:/data

volumes:
  connectx_postgres_data:
  connectx_redis_data:
  connectx_minio_data:
